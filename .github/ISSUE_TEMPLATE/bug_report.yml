name: Bug report
description: Something doesn't work, crashes, or gives a wrong result.
labels: ["bug"]
body:
    - type: markdown
      attributes:
          value: |
              Thanks for reporting this. Please don't attach recordings you aren't allowed to share publicly. Issues on this repository are visible to everyone.
    - type: input
      id: version
      attributes:
          label: App version
          description: The version you installed, e.g. 0.2.0. It's in the file name you downloaded.
      validations:
          required: true
    - type: dropdown
      id: os
      attributes:
          label: Operating system
          options:
              - Windows
              - macOS
              - Linux
      validations:
          required: true
    - type: input
      id: os-version
      attributes:
          label: Operating system version
          placeholder: e.g. Windows 11, macOS 15.4, Ubuntu 24.04
    - type: textarea
      id: what-happened
      attributes:
          label: What happened?
          description: What did you do, what did you expect, and what happened instead?
      validations:
          required: true
    - type: textarea
      id: recordings
      attributes:
          label: Recordings
          description: The file types, cameras or recorders involved, and roughly how long each recording is.
          placeholder: e.g. two GoPro MP4s (40 min each) and a Zoom H5 WAV
    - type: textarea
      id: extra
      attributes:
          label: Screenshots or error messages
          description: Paste any error text, or drag in a screenshot.
