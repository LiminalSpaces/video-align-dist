name: Feature request
description: Suggest something the app should do.
labels: ["enhancement"]
body:
    - type: textarea
      id: problem
      attributes:
          label: What are you trying to do?
          description: Describe the recordings and the job, not only the feature you have in mind.
      validations:
          required: true
    - type: textarea
      id: idea
      attributes:
          label: What would help?
